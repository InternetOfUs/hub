; Hardening recommended by the PHP advisories for CVE-2026-109618 and CVE-2026-109619
; (GHSA-w8hw-w9fx-j79w, GHSA-6wmf-4rv5-p3rp), still useful with a patched PHP.
; Loaded at startup by mod_php: unlike php_value in .htaccess, it is not reapplied per request.

; Session upload progress is one of the confirmed entry points of CVE-2026-109619;
; the site does not use it
session.upload_progress.enabled = 0

; The site has no file uploads
file_uploads = Off
upload_max_filesize = 2M

; Smaller request bodies and input make it harder to exhaust memory_limit (CVE-2026-109618)
post_max_size = 2M
max_input_vars = 300
max_input_nesting_level = 16
max_multipart_body_parts = 50
